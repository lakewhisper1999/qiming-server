server:
  port: 8088
  tomcat:
    max-swallow-size: 500MB
    max-http-post-size: 500MB
    connection-timeout: 600000  # 10分钟，支持大文件上传
    keep-alive-timeout: 60000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/qiming?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  secret: ${JWT_SECRET:qiming-artspace-jwt-secret-key-2026-kaiven}
  expiration: 86400000  # 24小时

# 文件上传路径
upload:
  path: ./uploads/
  access-path: /uploads/**

# 自动发布：后台保存数据后，自动重新导出前端静态快照(works.json + media 图片)。
# 只做「重新生成快照」这一步；git 提交与推送由开发者手动完成（不碰 git，无需凭据/SSH）。
# 默认关闭；本地启用方式（二选一，不要把这个改动提交到开源仓库）：
#   1) 环境变量：QIMING_PUBLISH_ENABLED=true  QIMING_PUBLISH_ARTSPACE_PATH=../qiming-artspace
#   2) 或把 enabled 改为 true
# artspace-path 可用绝对路径；相对路径基于本服务启动目录(qiming-server)解析。
# node-bin 仅在 node 不在 JVM 的 PATH 时填全路径（如 C:\xxx\node.exe）。
qiming:
  publish:
    enabled: false
    artspace-path: ../qiming-artspace
    node-bin: node
