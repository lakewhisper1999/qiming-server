server:
  port: 8088
  tomcat:
    max-swallow-size: 500MB
    max-http-post-size: 500MB
    connection-timeout: 600000  # 10分钟，支持大文件上传
    keep-alive-timeout: 60000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/qiming?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  secret: ${JWT_SECRET:qiming-artspace-jwt-secret-key-2026-kaiven}
  expiration: 86400000  # 24小时

# 文件上传路径
upload:
  path: ./uploads/
  access-path: /uploads/**
